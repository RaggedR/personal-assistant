[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pa-cli"
version = "0.1.0"
description = "Agent-friendly CLI for Gmail, Google Calendar and Contacts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Robin Langer" }]
keywords = ["gmail", "google-calendar", "cli", "claude", "agent"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "google-api-python-client>=2.100",
  "google-auth>=2.23",
  "google-auth-oauthlib>=1.1",
  "python-dateutil>=2.8",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
pa = "pa.cli:main"

[project.urls]
Homepage = "https://github.com/RaggedR/personal-assistant"

[tool.hatch.build.targets.wheel]
packages = ["src/pa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
